<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リーディング完全マスター B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>

  :root{
    color-scheme:light;
    --bg:#F4F1EA; --paper:#FFFFFF; --soft:#F8F5EE; --ink:#1E2A3A; --ink-2:#4A5568; --ink-3:#8A93A3;
    --rule:#E2DCCF; --navy:#2B3F5C; --orange:#C8693E; --orange-soft:#F7E6DC; --green:#3E8A6A; --green-soft:#E3F1EA;
    --red:#C0412F; --red-soft:#F9E3DF; --gold:#E9C46A; --hl:#FFF0B8; --hl-line:#E9C46A;
    --en:"Crimson Pro","Georgia","Times New Roman",serif;
    --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#13171E; --paper:#1B212B; --soft:#202733; --ink:#E9EDF3; --ink-2:#B8C1CF; --ink-3:#7F8A9C;
    --rule:#2F3846; --navy:#9CB8E0; --orange:#E89A72; --orange-soft:#3A2A22; --green:#6CC49E; --green-soft:#1C3229;
    --red:#F08A78; --red-soft:#3A2220; --gold:#E9C46A; --hl:#4A3F17; --hl-line:#C9A443;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15.5px;line-height:1.85;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px 80px}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px}

  /* nav */
  .nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
  .nav-in{max-width:860px;margin:0 auto;padding:8px 18px;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
  .nav-in::-webkit-scrollbar{display:none}
  .nav a{flex:none;text-decoration:none;color:var(--ink-2);font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;white-space:nowrap}
  .nav a:hover{color:var(--ink);background:var(--soft)}
  .nav a.on{background:var(--navy);color:var(--paper)}
  .theme{margin-left:auto;flex:none;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:4px 12px;font-size:12.5px}

  /* header */
  header{padding:30px 0 14px}
  .kicker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px;letter-spacing:.04em}
  .badge{background:var(--navy);color:#fff;border-radius:6px;padding:6px 12px;line-height:1.1;text-align:center;font-weight:700}
  :root[data-theme="dark"] .badge{color:#13171E}
  .badge small{display:block;font-size:9.5px;letter-spacing:.12em;opacity:.85}
  .badge b{font-size:22px;font-family:var(--en)}
  .tag{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
  .tag.t1{background:var(--orange);color:#fff}
  .tag.t2{background:var(--soft);color:var(--ink-2);border:1px solid var(--rule)}
  h1{font-family:var(--en);font-weight:700;color:var(--navy);font-size:clamp(28px,5vw,38px);line-height:1.18;margin:14px 0 4px}
  .sub{color:var(--ink-2);font-size:14px;margin:0}

  .card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:22px clamp(16px,4vw,30px);margin-top:18px}
  .illus{display:block;width:100%;height:auto;border-radius:12px}
  :root[data-theme="dark"] .illus{filter:brightness(.92)}
  section{scroll-margin-top:60px}
  .sec-h{display:flex;align-items:center;gap:10px;margin:34px 0 6px}
  .sec-h .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
  .sec-h h2{margin:0;font-size:18px}
  .sec-h .note{margin-left:auto;color:var(--ink-3);font-size:12px}
  .lead{color:var(--ink-2);font-size:13.5px;margin:4px 0 0}

  /* reading */
  .toggle-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);background:none;border:0;padding:0}
  .switch .knob{width:34px;height:20px;border-radius:99px;background:var(--rule);position:relative;transition:background .2s}
  .switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
  .switch[aria-pressed="true"] .knob{background:var(--navy)}
  .switch[aria-pressed="true"] .knob::after{left:16px}
  .para{display:flex;gap:12px;margin:14px 0}
  .pno{flex:none;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:6px}
  .para p{margin:0;font-family:var(--en);font-size:clamp(17px,2.4vw,19.5px);line-height:1.75;text-align:justify;hyphens:auto}
  .gp{font-weight:700}
  .show-gp .gp{color:var(--navy);background:linear-gradient(var(--gold),var(--gold)) 0 100%/100% 2.5px no-repeat;padding-bottom:1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .s{transition:background .3s;border-radius:3px}
  .s.ev{background:var(--hl);box-shadow:0 0 0 2px var(--hl);animation:pulse 1.4s ease 1}
  @keyframes pulse{0%{box-shadow:0 0 0 6px var(--hl-line)}100%{box-shadow:0 0 0 2px var(--hl)}}

  /* media */
  .media{display:grid;grid-template-columns:1fr;gap:16px}
  .media h3{margin:0 0 8px;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
  audio{width:100%}
  .rate{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .rate button{border:1px solid var(--rule);background:var(--soft);color:var(--ink-2);border-radius:99px;padding:3px 12px;font-size:12.5px}
  .rate button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
  .video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ytlink{display:inline-block;margin-top:6px;font-size:12.5px;color:var(--orange)}

  /* translation */
  details.tr{background:var(--soft);border-left:4px solid var(--green);border-radius:0 12px 12px 0;padding:0}
  details.tr summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;display:flex;align-items:center;gap:8px}
  details.tr summary::-webkit-details-marker{display:none}
  details.tr summary::after{content:"＋ 開く";margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:500}
  details.tr[open] summary::after{content:"－ 閉じる"}
  .tr-body{padding:0 18px 16px}
  .tr-body p{margin:0 0 10px;text-indent:1em;font-size:14.5px;color:var(--ink-2)}

  /* grammar items */
  .gi{border-top:1px solid var(--rule);padding:18px 0 6px;scroll-margin-top:70px;transition:background .4s}
  .gi:first-child{border-top:0;padding-top:4px}
  .gi.flash{background:var(--orange-soft);border-radius:10px}
  .gi h3{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:16px;color:var(--navy)}
  .gi h3 .n{width:24px;height:24px;border:1.5px solid var(--navy);border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
  .gi .lbl{color:var(--orange);font-weight:700;font-size:13px}
  .gi p{margin:4px 0;font-size:14.5px}
  .gi .en{font-family:var(--en);font-size:16px}
  .ex{background:var(--soft);border-left:3px solid #A8BBD6;border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0;font-size:14px}
  .ex .en{font-size:16.5px}

  /* grammar check */
  .gq{font-family:var(--en);font-size:clamp(17px,2.4vw,19px);line-height:2.4}
  .gq p{margin:0 0 12px;text-indent:1.2em}
  .blank{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;line-height:1;background:var(--soft);border:1px solid var(--rule);border-radius:99px;padding:2px 3px 2px 8px;margin:0 2px;font-family:var(--jp)}
  .blank .no{font-size:11px;color:var(--orange);font-weight:700;margin-right:2px}
  .blank button{border:0;background:transparent;color:var(--ink-2);border-radius:99px;padding:3px 8px;font-size:13px;font-family:var(--en);font-weight:600}
  .blank button:hover{background:var(--paper);color:var(--ink)}
  .blank button.pick{background:var(--navy);color:var(--paper)}
  .blank.ok{border-color:var(--green);background:var(--green-soft)}
  .blank.ok button.pick{background:var(--green)}
  .blank.ng{border-color:var(--red);background:var(--red-soft)}
  .blank.ng button.pick{background:var(--red)}
  .blank .mark{font-size:13px;font-weight:700;padding:0 4px}
  .blank.ok .mark{color:var(--green)} .blank.ng .mark{color:var(--red)}
  .gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
  .score{font-weight:700;font-size:14px}
  .score b{color:var(--orange);font-size:18px;font-family:var(--en)}
  .btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700}
  .btn:hover{color:var(--ink);border-color:var(--ink-3)}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
  .alist{margin:6px 0 0;padding:0;list-style:none}
  .alist li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-top:1px dashed var(--rule)}
  .alist .num{width:26px;height:22px;border-radius:5px;background:var(--gold);color:#3b2f10;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
  .alist .ans{font-weight:700;color:var(--navy)}
  .alist .ans .res{font-size:12px;margin-left:8px;font-weight:700}
  .alist .res.ok{color:var(--green)} .alist .res.ng{color:var(--red)}
  .alist .exp{grid-column:2;font-size:13.5px;color:var(--ink-2);margin:0}
  .alist li[hidden]{display:none}
  .golink{border:0;background:none;color:var(--orange);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:2px;font-size:13.5px}
  .jt{margin-top:14px;font-size:14px;color:var(--ink-2)}
  .jt p{margin:0 0 8px;text-indent:1em}

  /* reading quiz */
  .rq{border-top:1px solid var(--rule);padding:20px 0 6px}
  .rq:first-of-type{border-top:0;padding-top:4px}
  .rq .qh{display:flex;gap:10px;align-items:flex-start}
  .rq .qn{flex:none;background:var(--navy);color:var(--paper);border-radius:6px;font-weight:700;font-size:13px;padding:2px 9px;margin-top:4px}
  .rq .qtext{font-family:var(--en);font-size:clamp(17px,2.3vw,18.5px);line-height:1.6;margin:0}
  .rq .qja{font-size:12.5px;color:var(--ink-3);margin:2px 0 0}
  .opts{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px;font-family:var(--en);font-size:clamp(16px,2.2vw,17.5px);line-height:1.5;transition:border-color .15s,background .15s}
  .opt:hover:not([disabled]){border-color:var(--ink-3)}
  .opt .k{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-size:12px;font-family:var(--jp);font-weight:700;margin-top:2px}
  .opt[disabled]{cursor:default}
  .opt.correct{border-color:var(--green);background:var(--green-soft)}
  .opt.correct .k{background:var(--green);border-color:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}
  .opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
  .fb{margin-top:12px;border-radius:12px;padding:14px 16px;background:var(--soft);font-size:14px}
  .fb[hidden]{display:none}
  .fb .v{font-weight:700;font-size:15px;margin:0 0 6px}
  .fb .v.ok{color:var(--green)} .fb .v.ng{color:var(--red)}
  .fb .evid{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:8px 0}
  .fb .evid .en{font-family:var(--en);font-size:16.5px;line-height:1.55}
  .fb .evid .ja{font-size:13px;color:var(--ink-2);display:block;margin-top:2px}
  .fb ul{margin:8px 0 0;padding-left:0;list-style:none}
  .fb li{margin:5px 0;padding-left:28px;position:relative}
  .fb li .k{position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:1px solid var(--rule);display:grid;place-items:center;font-size:11px;font-weight:700}
  .fb li.right .k{background:var(--green);border-color:var(--green);color:#fff}
  .tobody{margin-top:8px}
  .rscore{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--rule)}

  /* 読解クイズ：本文を横に並べる */
  .wide{width:min(1180px,calc(100vw - 36px));margin-left:calc((100% - min(1180px,calc(100vw - 36px))) / 2)}
  .rq-grid{display:grid;grid-template-columns:1fr;gap:24px;margin-top:10px}
  .rq-pass{display:none}
  .rp-h{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink-3)}
  .rp-para{display:flex;gap:10px;margin:0 0 14px;border-radius:10px;padding:6px 8px;transition:opacity .25s,background .25s}
  .rp-para p{margin:0;font-family:var(--en);font-size:16.5px;line-height:1.65}
  .rp-para .pno{margin-top:3px}
  .rq-pass.focus .rp-para{opacity:.38}
  .rq-pass.focus .rp-para.cur{opacity:1;background:var(--paper);box-shadow:0 0 0 1px var(--rule)}
  .rq-ctx{margin:12px 0 0;background:var(--soft);border-radius:12px;border:1px solid var(--rule)}
  .rq-ctx summary{list-style:none;cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;gap:6px}
  .rq-ctx summary::-webkit-details-marker{display:none}
  .rq-ctx summary::after{content:"閉じる";margin-left:auto;font-weight:500;color:var(--ink-3)}
  .rq-ctx:not([open]) summary::after{content:"開く"}
  .rq-ctx .rp-para{padding:0 12px;margin:0 0 12px}
  .hide-ja .qja{display:none}
  @media (min-width:1000px){
    .rq-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
    .rq-pass{display:block;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto;background:var(--soft);border-radius:14px;padding:14px 14px 4px;border:1px solid var(--rule)}
    .rq-ctx{display:none}
  }
  footer{margin-top:40px;color:var(--ink-3);font-size:12px;text-align:center}
  @media (max-width:560px){ .para{gap:8px} .card{border-radius:12px} }

  /* Part 切り替え */
  .chapbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:18px 0 0}
  .ctab{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;min-width:38px;height:34px;padding:0 12px;font-weight:700;font-size:14px;cursor:pointer}
  .ctab[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
  .ctab:hover:not([aria-pressed="true"]){border-color:var(--ink-3)}
  .chapbar .lbl2{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);margin-right:4px}
  .partbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0 0}
  @media (max-width:640px){
    .partbar .lbl2{display:none}
    .partbar{gap:6px}
    .ptab{padding:6px 10px}
    .partbar .ptab span{display:none}
    .partbar .ptab{min-width:0;flex:0 0 auto}
  }
  .partbar .lbl2{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);margin-right:4px}
  .ptab{border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:10px;padding:6px 12px;text-align:left;line-height:1.3;min-width:0}
  .ptab b{display:block;font-size:13px;color:var(--ink)}
  .ptab span{display:block;font-size:11.5px;font-family:var(--en);max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ptab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
  .ptab[aria-selected="true"] b{color:var(--paper)}
  .ptab:hover:not([aria-selected="true"]){border-color:var(--ink-3)}
  .alist .exp .golink{margin-right:4px}
  .blank .sl{color:var(--ink-3);font-size:12px}
  .nextpart{display:flex;justify-content:flex-end;margin-top:26px}
</style>
</head>

</nav>

<div class="wrap">
  <div class="chapbar" id="chapbar" aria-label="Chapter を選ぶ"></div>
  <div class="partbar" role="tablist" aria-label="Part を選ぶ" id="partbar"></div>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<script>
const OPTS4 = ["a", "an", "the", "×"];
const LESSONS = [
{
  id: "1-1", chapter: 1, part: 1,
  title: "Beyond the Sentence: The Hidden Walls in Interaction",
  ja: "文を超えて：相互作用に潜む見えない壁",
  tags: ["異文化コミュニケーション", "名詞と冠詞の有無"],
  img: "img/1-1.jpg",
  imgAlt: "ドアのそばで、日本人の訪問者が名刺を差し出しているイラスト。下に Grammar alone → Real interaction → Cultural rules matter の流れ図。",
  audio: "audio/1-1.mp3",
  yt: "QJ2Xu_oz5as",
  passage: [
  [
    ["s1","Why is it necessary to understand English-Japanese cross-cultural communication?"],
    ["s2","Traditionally, [[English education]] in Japan has focused heavily on [[sentence grammar]]."],
    ["s3","Through rigorous study, learners often master complex structures, ensuring a high level of [[grammatical correctness]] within a single sentence."],
    ["s4","However, [[the accuracy]] of a sentence does not always guarantee [[the success]] of a conversation."],
    ["s5","When Japanese speakers engage in [[international interaction]], they frequently encounter [[unforeseen difficulties]] that go beyond simple rules of syntax."]

  [

    ["s13","While [[a bow]] is [[the standard]] in Japan, [[a firm handshake]] and [[direct eye contact]] are expected in [[the English-speaking world]]."],
    ["s14","If [[the visitor]] looks down to show [[respect]], Mr. Smith might misinterpret [[the gesture]] as [[a sign]] of [[distrust]] or [[a lack]] of confidence."],
    ["s15","This is where [[the importance]] of [[explicit instruction]] in discourse and pragmatics becomes clear."]
  ]

  trans: [
    "年齢や序列に対する認識は文化によって大きく異なり、それが社会の機能のあり方を形成することがよくあります。日本では、年齢は社会的相互作用の主要な決定要因です。高齢者に敬意を払うことは単なる儀礼ではなく、社会的な要件であることを世間一般の人々は認識しています。これにより、お年寄りが深い敬意をもって扱われるという独特の力学が生まれます。例えば、学校という環境では、クラスはしばしば一つのまとまりとして動きますが、その内部では厳格な年功序列のルールが適用されます。下級生は上級生に話しかける際に特定の敬語を使用し、縦型の社会構造を強化します。",
    "対照的に、多くの英語圏の国々では、年齢の壁は言語そのものにおいてはそれほど可視化されません。若者も老人も、プロフェッショナルな環境であっても、ファーストネームで呼び合うことがよくあります。現代のアメリカ企業を考えてみましょう。スタッフは、在職期間や年齢に関係なく、頻繁に個人の意見を自由に述べるよう奨励されます。会議では、新入社員の採用を担当する委員会は、年功よりもスキルを優先するかもしれません。日本のチームが通常、最年長メンバーの指示に従うのに対し、欧米のチームは合意に達するためにメンバー間で議論を戦わせることが多く、年長者と同様に若手メンバーの意見も尊重します。",
    "しかし、こうした文化の違いを乗り切るには、ある種の文化的知識（手荷物）を捨て去る必要があります。日本人が欧米人と接する際、敬語を使いすぎると距離感を生むかもしれません。逆に、欧米人が日本で肩書きを使わないと、人々は彼らを失礼だと感じるかもしれません。これは単に言語の問題だけではなく、非言語的なものにも及びます。例えば、日本のビジネス環境における衣類（服装）は、しばしばその人の地位や順応性を反映しますが、シリコンバレーではCEOがTシャツを着ていることもあります。",

    <div class="gi" id="gi1">
      <h3><span class="n">1</span>集合名詞の単数・複数扱い</h3>
      <p><span class="lbl">文法ポイント：</span><span class="en">family, team, class, committee, public, audience</span> などの集合名詞は、その集団を「一つのまとまった単位」として見るときは単数扱いをし、集団を構成する「個々のメンバー」に焦点を当てるときは複数扱いをします。</p>

      <div class="ex">（単数扱い）<span class="en">In a traditional Japanese household, <b>the family</b> often revolves around the grandparents.</span>（伝統的な日本の家庭では、家族は祖父母を中心に回っていることが多いです。）</div>
      <div class="ex">（複数扱い）<span class="en"><b>A couple</b> were arguing in a movie I watched recently.</span>（私が最近見た映画の中で、ある夫婦が口論をしていました。）</div>
    </div>
    <div class="gi" id="gi2">
      <h3><span class="n">2</span>常に複数扱いの集合名詞</h3>
      <p><span class="lbl">文法ポイント：</span><span class="en">people, police, cattle</span> などは、形は単数形に見えますが、常に複数扱いとなります。不定冠詞 a は付きません。数える場合は <span class="en">two persons/people, two police officers, two cows</span> などと言います。</p>
      <div class="ex"><span class="en"><b>The police</b> have arrived at the scene.</span>（警察が現場に到着した。）</div>
      <div class="ex"><span class="en"><b>People</b> are waiting for the store to open.</span>（人々は店が開くのを待っている。）</div>
    </div>
    <div class="gi" id="gi3">
      <h3><span class="n">3</span>常に不可算（数えられない）の集合名詞</h3>
      <p><span class="lbl">文法ポイント：</span><span class="en">furniture</span>（家具）, <span class="en">baggage</span>（手荷物）, <span class="en">clothing</span>（衣類）, <span class="en">machinery</span>（機械類）などは、集合的な総称を表すため、数えられない名詞（不可算名詞）として扱います。a を付けたり、複数形の s を付けたりすることはできません。数える場合は <span class="en">a piece of</span> などを使います。ちなみに、<span class="en">bag, machine</span> は可算名詞で、「服」の <span class="en">clothes</span> は複数扱いで、基本単数形はありません（<span class="en">clothes</span> /kloʊðz/ タイプは他に <span class="en">goods, wages, sales, earnings, contents</span> など）。</p>
      <div class="ex"><span class="en"><b>All the furniture</b> was moved to the new office.</span>（すべての家具が新しいオフィスに運ばれた。）</div>
      <div class="ex"><span class="en">She packed too much <b>clothing</b> for the weekend trip.</span>（彼女は週末旅行のために衣類を詰め込みすぎた。）</div>
    </div>
    <div class="gi" id="gi4">
      <h3><span class="n">4</span>「the + 形容詞」= 集合名詞</h3>
      <p><span class="lbl">文法ポイント：</span>the に形容詞（または形容詞用法の分詞）を付けることで、「〜な人々」という複数扱いの集合名詞になります。<span class="en">the rich</span>（金持ち）, <span class="en">the poor</span>（貧しい人々）, <span class="en">the young</span>（若者）, <span class="en">the elderly</span>（お年寄り）などがあります。分詞からの形容詞も同様の扱いです（<span class="en">the aged</span>「お年寄りたち」, <span class="en">the following</span>「以下の事柄」）。</p>

  trans: [
    "現代建築の領域において、議論は純粋に美的なデザインから環境への責任へと移行しています。世界人口が増加するにつれて、住宅やインフラへの需要は天然資源に甚大な圧力をかけています。伝統的に、建設業界はコンクリートと鋼鉄に大きく依存してきました。これらの素材は耐久性を提供しますが、その生産には多大なエネルギーが消費され、かなりの炭素排出をもたらします。その結果、建築家たちは現在、構造的な完全性を損なうことなく環境への影響を減らす代替素材を模索しています。",
    "そのような復活の一つが木材の使用です。何世紀もの間、木材は主要な建築資材でしたが、火災への懸念から都市環境ではレンガや金属に大きく取って代わられました。しかし、現代工学は直交集成板（CLT）を生み出しました。これはコンクリートと同じくらい強度がありながら、二酸化炭素排出量はずっと低い素材です。建設に木材を使用することは、炭素を貯蔵するだけでなく建物の重量を減らし、基礎に必要なセメントの量を減らすことにもなります。さらに、プラスチックの生産に使われる石油のような有限な資源とは異なり、木材は正しく管理されれば再生可能です。",
    "水管理も持続可能な建築の重要な側面です。建設プロセス自体が数百万ガロンもの水をがぶ飲みし、建物が稼働し始めると、居住者はさらに多くを消費します。革新的なデザインは現在、雨水を集める仕組みや、生活排水を再利用するシステムを組み込んでいます。単に効率的な設備を設置するだけで、建物の寿命全体でかなりの量の水を節約できます。",
    "これらの環境に優しい建造物のインテリアデザインもまた、素材使用の変化を反映しています。合成カーペットの代わりに、デザイナーはコルクや竹を選ぶかもしれません。部屋に家具を備え付ける際、再生オークやリサイクルガラスで作られた家具一点を見つけることもあるでしょう。照明さえも考慮されています。広々とした窓は、単に景観のためだけでなく自然光を最大化するためにガラスを使用し、電気の必要性を減らします。",
    "興味深いことに、素材への評価はその多様性に対する繊細な理解へとつながっています。ソムリエがさまざまなワインを区別するように、建築家は耐久性のための花崗岩や優雅さのための大理石など、さまざまな石材の中から選択します。現代的な環境配慮型建築のカフェテリアでは、ロビーに使われている石材と地元の川床で見つけた一個の石を比較しながら、一杯のコーヒーを楽しんでいる労働者を見かけるかもしれません。結局のところ、目標は人類と地球の素材を調和させ、今日のためだけでなく、来るべき世代のために建設することを確実にすることなのです。"

  grammar: `
    <p class="lead" style="margin:0 0 6px">物質名詞は、一定の形を持たず、分割してもその性質が変わらない物質（材料、気体、液体、食品など）を表す名詞です。</p>
    <div class="gi" id="gi1">
      <h3><span class="n">1</span>物質名詞の基本的性質</h3>
      <p><span class="lbl">文法ポイント：</span>物質名詞は数えられない名詞（不可算名詞）として扱います。不定冠詞 a/an は付かず、複数形にもなりません。動詞は単数形で受けます。</p>
      <div class="ex"><span class="en"><b>Gold</b> is a precious metal that has been valued for centuries.</span>（金は何世紀にもわたって評価されてきた貴金属だ。）</div>
      <div class="ex"><span class="en"><b>Plastic</b> has replaced glass in many everyday products.</span>（多くの日用品において、プラスチックがガラスに取って代わりました。）</div>
    </div>
    <div class="gi" id="gi2">
      <h3><span class="n">2</span>数量の表し方：数量詞と部分詞</h3>
      <p><span class="lbl">文法ポイント：</span>物質名詞の量を表すには、<span class="en">much, a little, a great deal of</span> などの数量詞や、<span class="en">a piece of, a bottle of</span> といった単位（部分詞）を使います。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>a great deal of energy, less cement, millions of gallons of water, a piece of furniture</b></span>. ※特に <span class="en">a piece of</span> は多くの不可算名詞につく（<span class="en">baggage/luggage, information, advice, news, cake, music, paper</span>（<span class="en">a paper</span> だと「一つの論文／書類／新聞」）など多数）。</p>
      <div class="ex"><span class="en">He gave me <b>a useful piece of advice</b> regarding my career.</span>（彼は私のキャリアに関して有益なアドバイスを一つくれた。）</div>
      <div class="ex"><span class="en">Please add <b>a pinch of salt</b> to the soup.</span>（スープに塩をひとつまみ加えてください。）</div>
      <div class="ex"><span class="en">The car consumes <b>gallons of gas</b> every week.</span>（その車は毎週何ガロンものガソリンを消費する。）※ one gallon は約3.8リットル。</div>
    </div>
    <div class="gi" id="gi3">
      <h3><span class="n">3</span>物質名詞の普通名詞化</h3>
      <p><span class="lbl">文法ポイント：</span>物質名詞が「具体的な製品」「個体」「種類」を表す場合、普通名詞（可算名詞）として扱われ、a/an が付いたり複数形になったりします。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>different wines</b></span>：「ワイン」という液体ではなく「様々な種類のワイン」。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>various stones</b> vs <b>the stone</b> vs <b>a stone</b></span>：「様々な種類の石材（可算・種類）」、「（材質としての）石（不可算）」、「（個体としての）一個の石（可算）」。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>a coffee</b></span>：「一杯のコーヒー」という具体的な注文品。</p>
      <div class="ex"><span class="en">This shop sells <b>fine teas</b> from all over the world.</span>（この店は世界中の上質なお茶（の数々）を売っている。→種類）</div>
      <div class="ex"><span class="en">She picked up <b>a rock</b> and threw it into the lake.</span>（彼女は石を一個拾って湖に投げた。→個体）</div>
      <div class="ex"><span class="en">The statue is made of solid <b>rock</b>.</span>（その像は固い岩でできている。→材質）</div>

    <p class="lead" style="margin:0 0 6px">固有名詞は、特定の人、場所、組織などの固有の名称であり、常に大文字で始めます。通常はゼロ冠詞ですが、建造物や複数形の固有名詞などには定冠詞 the が付きます。</p>
    <div class="gi" id="gi1">
      <h3><span class="n">1</span>ゼロ冠詞の固有名詞</h3>
      <p><span class="lbl">文法ポイント：</span>人名、大陸、国、州、都市、公共の場所（駅、空港、港、公園、広場、通りなど）、サイズが明白な地理的名称（湖、単独の山、小さい湾）などは、通常ゼロ冠詞で使われます。※私立の大学は普通ゼロ冠詞で（<span class="en">Yale University</span>）、公立の大学は <span class="en">the University of ~</span> のパターンが多いです（<span class="en">the University of California, the University of Toronto</span>）。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en">Charles Lindbergh, Europe, North America, Newfoundland, Ireland, Clifden, Roosevelt Field, New York, Paris, France, Greenland, Iceland, Africa, London Heathrow, JFK Airport</span>.</p>
      <div class="ex"><span class="en"><b>Tokyo Station</b> is one of the busiest stations in <b>Japan</b>.</span>（東京駅は日本で最も混雑する駅の一つだ。）</div>
      <div class="ex"><span class="en">He climbed <b>Mount Fuji</b> last summer.</span>（彼は去年の夏、富士山に登った。）</div>
    </div>
    <div class="gi" id="gi2">
      <h3><span class="n">2</span>定冠詞（the）が付く固有名詞</h3>
      <p><span class="lbl">文法ポイント：</span>サイズが明白ではない地理的名称（海、河川、砂漠、海峡、半島、大きい湾など）や複数形の固有名詞（山脈、諸島、チームの名称など）には the が付きます。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en">The Atlantic Ocean</span>（海）, <span class="en">the Alps</span>（山脈）, <span class="en">the Sahara</span>（砂漠）. ※その他の例：<span class="en">the Nile, the English Channel, the Gulf of Mexico, the Rockies, the Yankees, the Dodgers</span> など。※「広島カープ」の carp は単複同型名詞で <span class="en">the Carp</span> で複数扱いです（<span class="en">The Carp are ~.</span>）。</p>
      <div class="ex"><span class="en"><b>The Nile</b> is the longest river in the world.</span>（ナイル川は世界で一番長い川だ。）</div>
      <div class="ex"><span class="en"><b>The Malay Peninsula</b> lies between <b>the Andaman Sea</b> and <b>the South China Sea</b>.</span>（マレー半島はアンダマン海と南シナ海の間に位置しています。）</div>
      <p><span class="lbl">国名（複合名詞）：</span>"States", "Kingdom", "Republic" などを含む国名には the が付きます。<span class="lbl">パッセージ例：</span><span class="en">the United States</span>.</p>
      <div class="ex"><span class="en">She is from <b>the United Kingdom</b>.</span>（彼女はイギリス出身だ。）</div>
      <p><span class="lbl">建造物・ホテル・新聞・船舶など：</span>有名な建物、ホテル、新聞、船などの名前には the が付きます。<span class="lbl">パッセージ例：</span><span class="en">The Spirit of St. Louis</span>（飛行機名）, <span class="en">The Ritz</span>（ホテル）, <span class="en">the Plaza</span>（ホテル）. ※その他の例：<span class="en">the White House, the Statue of Liberty, the Eiffel Tower</span> など。</p>
      <div class="ex"><span class="en">Have you ever visited <b>the Empire State Building</b>?</span>（エンパイアステートビルに行ったことはありますか？）</div>
      <div class="ex"><span class="en">I read an article in <b>the New York Times</b> about Japan’s tourism boom.</span>（ニューヨーク・タイムズで、日本の観光ブームについての記事を読みました。）</div>
      <div class="ex"><span class="en"><b>The Titanic</b> sank in <b>the North Atlantic</b> after hitting an iceberg.</span>（タイタニック号は氷山に衝突した後、北大西洋で沈没しました。）</div>
    </div>
    <div class="gi" id="gi3">
      <h3><span class="n">3</span>固有名詞 → 普通名詞</h3>
      <p><span class="lbl">文法ポイント：</span>固有名詞に不定冠詞 a/an を付けたり複数形にすることで、「〜のような人／物」「〜という製品」「〜という人」という意味の普通名詞として使うことができます。</p>

  trans: [
    "COVID-19の突然の出現は、現代史上最も憂慮すべき生物学的現象の一つとして知られています。人類が管理する方法を学んできた季節性インフルエンザとは異なり、この新型ウイルスは人類という種全体を脅かしました。初期段階では科学的データが乏しく、世界的な統計はしばしば信頼性に欠けるものでした。しかし、最近の統計が示すように、感染率は当初の予測よりもはるかに高いものでした。それは異なる大陸で同時に複数の健康危機を引き起こし、医療システムを圧倒し、私たちの生活を永遠に変えてしまいました。",

    "経済的な影響は壊滅的でした。経済学は複雑な分野ですが、専門家でなくてもその被害は明らかでした。多くの企業が閉鎖し、数百万人の生活の手段が失われました。接客業の分野では、所得がゼロにまで急落しました。政府は財政援助を提供しましたが、多くの家族にとって500ドルは1か月分の家賃と食費を賄うには十分ではありませんでした。歴史家が指摘するように、10年という期間はこのような深刻な不況から回復するには長い時間ですが、世界は迅速に適応しなければなりませんでした。",

  grammar: `
    <div class="gi" id="gi1">
      <h3><span class="n">1</span>外来語の複数形</h3>
      <p><span class="lbl">文法ポイント：</span>ギリシャ語やラテン語由来の外来語には、不規則な複数形を持つものがあります。-on で終わる語は -a に、-is で終わる語は -es に、-um で終わる語は -a に変化します。<span class="en">phenomenon → phenomena, crisis → crises, bacterium → bacteria</span> など。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en">one of the most alarming biological <b>phenomena</b></span>（最も憂慮すべき生物学的現象の一つ）, <span class="en">multiple health <b>crises</b></span>（複数の健康危機）, <span class="en">Unlike <b>bacteria</b></span>（細菌とは異なり）</p>

    <div class="gi" id="gi2">

      <p><span class="lbl">パッセージ例：</span><span class="en">global <b>statistics were</b> often unreliable</span>（世界的な統計データはしばしば信頼できないものでした）, <span class="en">as recent <b>statistics show</b></span>（最近の統計データが示しているように）</p>

    <div class="gi" id="gi4">

      <p><span class="lbl">文法ポイント：</span>集合的に人々や集団を指す名詞で、形は単数に見えても常に複数扱いとなります。不定冠詞 a は付きません。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en">The <b>police were</b> deployed</span>（警察が配備された）, <span class="en"><b>people</b> were urged</span>（人々は強く促された）</p>

    <p class="lead" style="margin:0 0 6px">形容詞には、名詞を直接修飾する限定用法と、補語（C）として主語や目的語の状態を説明する叙述用法があります。このパートでは、複数の形容詞の語順、後置修飾、[too/so/as/how] + 形容詞 + a/an + 名詞の語順も扱います。</p>

    <div class="gi" id="gi1">
      <h3><span class="n">1</span>S+V+C（第2文型）の叙述用法</h3>
      <p><span class="lbl">文法ポイント：</span>形容詞が主語の状態や性質を説明する補語（C）として機能します。</p>
      <p><span class="lbl">形容詞が必須のケース：</span><span class="en">be, become, look, seem, turn</span> などの連結動詞と共に使われます。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>lie awake</b></span>（横になって起きている）, <span class="en">It <b>remains essential</b></span>（それは不可欠なままである）.</p>
      <div class="ex"><span class="en">The leaves turned <b>red</b> in autumn.</span>（秋になり、葉が赤く変わった。）</div>
      <p><span class="lbl">形容詞がなくても文が成り立つケース（2次的述語）：</span>完全自動詞の後ろに形容詞が続き、主語の状態を説明します。「〜の状態で（Vする）」と訳せます。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>grow up dependent</b></span>（依存した状態で成長する）, <span class="en"><b>live happy</b></span>（幸せに生きる）, <span class="en"><b>die satisfied</b></span>（満足して死ぬ）.</p>
      <div class="ex"><span class="en">He returned home <b>exhausted</b> after the long trip.</span>（長い旅の後、彼は疲れ果てて帰宅した。）</div>

      <p><span class="lbl">独立的用法（分詞構文・形容詞句）：</span>文頭や文中に置かれ、主語の状態を説明する副詞的な働きをします。接続詞や主語が省略された形です。</p>

    </div>
    <div class="gi" id="gi2">

      <p><span class="lbl">文法ポイント：</span>形容詞が目的語（O）の状態や性質を説明する補語（C）として機能します。</p>
      <p><span class="lbl">Cの形容詞が必須のケース：</span><span class="en">find, keep, make, leave</span> などの動詞。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>find</b> instant messaging <b>convenient</b></span>（便利だとわかる）, <span class="en"><b>keep</b> us <b>connected</b></span>（つながった状態に保つ）, <span class="en"><b>leave</b> messages <b>unread</b></span>（未読のままにする）.</p>

    <p class="lead" style="margin:0 0 6px">形容詞には、名詞の前に置いて直接修飾する「限定用法」と、補語（C）として使う「叙述用法」があります。どちらか一方の用法しかない形容詞や、用法によって意味が変わる形容詞に注意しましょう。</p>

      <h3><span class="n">1</span>限定用法のみある形容詞</h3>
      <p><span class="lbl">文法ポイント：</span>これらの形容詞は、名詞の前（限定用法）でのみ使われ、補語（叙述用法）にはなりません。</p>
      <p><span class="lbl">強調の形容詞：</span><span class="en">mere</span>（単なる）, <span class="en">sheer</span>（全くの）, <span class="en">total</span>（完全な）, <span class="en">utter</span>（全くの）, <span class="en">very</span>（まさにその）.</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>a mere 14-year-old fisherman</b></span>（ほんの14歳の漁師）, <span class="en"><b>the only Japanese person</b></span>（唯一の日本人）, <span class="en"><b>sheer determination</b></span>（全くの決意）, <span class="en"><b>an outright death sentence</b></span>（明白な死刑宣告）</p>
      <div class="ex"><span class="en">It was <b>sheer</b> luck that we met.</span>（私たちが会ったのは全くの運だった。）</div>
      <p><span class="lbl">比較・最上級由来：</span><span class="en">former</span>（前の）, <span class="en">latter</span>（後の）, <span class="en">inner</span>（内側の）, <span class="en">upper</span>（上の方の）, <span class="en">utmost</span>（最大の）, <span class="en">elder</span>（年長の）.</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>his later years</b></span>（晩年）</p>
      <div class="ex"><span class="en">The <b>inner</b> circle of the group knew the truth.</span>（グループの核心メンバーは真実を知っていた。）</div>

      <p><span class="lbl">その他：</span><span class="en">main</span>（主な）, <span class="en">only</span>（唯一の）, <span class="en">live</span>（生きている, 生放送の）, <span class="en">sole</span>（唯一の）.</p>
      <div class="ex"><span class="en">The <b>sole</b> survivor told the story.</span>（唯一の生存者がその話をした。）</div>
    </div>
    <div class="gi" id="gi2">
      <h3><span class="n">2</span>叙述用法のみある形容詞</h3>
      <p><span class="lbl">文法ポイント：</span>これらの形容詞は、補語（C）としてのみ使われ、名詞を直接修飾しません。多くは a- で始まる語です。</p>
      <p><span class="lbl">a- で始まる形容詞：</span><span class="en">afraid</span>（恐れて）, <span class="en">alive</span>（生きて／気づいて）, <span class="en">alone</span>（一人で）, <span class="en">asleep</span>（眠って）, <span class="en">awake</span>（目覚めて）, <span class="en">aware</span>（気づいて）, <span class="en">ashamed</span>（恥じて）.</p>
      <p><span class="lbl">パッセージ例：</span><span class="en">struggling to stay <b>alive</b></span>（生き延びようと奮闘し）, <span class="en">They were completely <b>alone</b></span>（彼らは完全に孤独だった）, <span class="en">the government officials were <b>aware</b> of his unique experiences</span>（政府の役人たちは彼の特異な経験に気づいていた）</p>

    <div class="gi" id="gi3">
      <h3><span class="n">3</span>用法によって意味が異なる形容詞</h3>
      <p><span class="lbl">文法ポイント：</span>限定用法と叙述用法で意味が変わる形容詞です。</p>
      <p><span class="lbl">late（限定）：</span>「故〜」（<span class="en">the late Mr. X</span>）、「（時間的に）晩年の／終わりの」（<span class="en">late autumn</span>）.</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>The late Nakahama Manjiro</b></span>（故・中濱万次郎）</p>
      <div class="ex"><span class="en">The <b>late</b> Mr. Smith devoted his life to education and community service.</span>（故スミス氏は、生涯を教育と地域奉仕に捧げました。）</div>
      <p><span class="lbl">late（叙述）：</span>「遅れた」（<span class="en">be late</span>）.</p>
      <div class="ex"><span class="en">The train was <b>late</b>.</span>（電車は遅れた。）</div>
      <p><span class="lbl">present（限定）：</span>「現在の」（<span class="en">the present situation</span>）.</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>The present situation</b> in his home country</span>（母国の現在の状況）</p>
      <div class="ex"><span class="en">Small businesses often struggle to survive in the <b>present</b> economy.</span>（現在の経済状況では、中小企業は生き残るのが難しいことが多いです。）</div>
      <p><span class="lbl">present（叙述）：</span>「出席している」（<span class="en">be present</span>）.</p>
      <div class="ex"><span class="en">All members were <b>present</b>.</span>（全員出席していた。）</div>
      <p><span class="lbl">certain（限定）：</span>「ある〜」（<span class="en">a certain man</span>）.</p>
      <p><span class="lbl">パッセージ例：</span><span class="en">acquired <b>a certain level</b> of English proficiency</span>（ある程度の英語の能力を身につけた）</p>
      <div class="ex"><span class="en">A <b>certain</b> person told me.</span>（ある人が私に言った。）</div>
      <p><span class="lbl">certain（叙述）：</span>「確信している」（<span class="en">be certain of/that</span>）.</p>
      <div class="ex"><span class="en">He is <b>certain</b> that he left his keys on the table.</span>（彼は鍵をテーブルの上に置いたと確信している。）</div>
      <p><span class="lbl">responsible（限定）：</span>「責任感のある」（<span class="en">a responsible person</span>）.</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>a highly responsible leader</b></span>（非常に責任感のあるリーダー）</p>
      <div class="ex"><span class="en">We need a <b>responsible</b> manager.</span>（責任感のあるマネージャーが必要だ。）</div>
      <p><span class="lbl">responsible（叙述）：</span>「責任がある」（<span class="en">be responsible for</span>）.</p>
      <p><span class="lbl">パッセージ例：</span><span class="en">Manjiro was primarily <b>responsible for</b> guiding the vessel safely.</span>（万次郎が安全に船を導く責任を主に負っていた）</p>
      <div class="ex"><span class="en">She is <b>responsible</b> for training new staff members.</span>（彼女は新しいスタッフの研修を担当している。）</div>
      <p><span class="lbl">right（限定）：</span>「右の」（<span class="en">right hand</span>）.</p>
      <p><span class="lbl">パッセージ例：</span><span class="en">exactly <b>the right person</b> to help the country</span>（国を助けるまさにうってつけの人物）</p>
      <div class="ex"><span class="en">He injured his <b>right</b> leg during soccer practice.</span>（彼はサッカーの練習中に右足をけがした。）</div>

  trans: [
    "日本人の英語学習者がネイティブスピーカーと交流する中で、効果的なコミュニケーションには教科書の知識だけでは到底足りないことがすぐにわかってきます。何気ない言葉や日常的な習慣には、深い文化的意味が込められていることがあるのです。まず、挨拶の使い方を考えてみましょう。日本では「おはよう」「こんばんは」のように時間帯によって言葉を使い分けるのが基本です。一方、英語話者が重視するのは状況がどれほどフォーマルかカジュアルかという点です。道でばったり会った友人に「Good evening」と言うと、やけに堅苦しく聞こえてしまいます。この微妙な違いは見落としやすいですが、幸い日常の場面では「Hi」や「Hello」という気軽な選択肢があります。",

    <div class="gi" id="gi1">
      <h3><span class="n">1</span>[be + 形容詞 + to不定詞]</h3>
      <p><span class="lbl">文法ポイント：</span>感情や意欲を表す形容詞（<span class="en">eager, happy, ready</span> など）の後に to不定詞を続け、その原因や対象を表します。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>fortunate to have</b></span>（所有していて幸運だ）, <span class="en"><b>ready to give</b></span>（与える準備ができている）</p>
      <div class="ex"><span class="en">I <b>am glad to hear</b> the news.</span>（その知らせを聞いてうれしい。）</div>
    </div>
    <div class="gi" id="gi2">
      <h3><span class="n">2</span>[be + 形容詞 + 前置詞/that節/wh-節]</h3>
      <p><span class="lbl">文法ポイント：</span>形容詞によっては、to不定詞ではなく、特定の前置詞や that節、wh-節をとるものがあります（<span class="en">aware of, aware that, aware (of) what</span>）。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>afraid of</b></span>（〜を恐れている）</p>
      <div class="ex"><span class="en">He <b>was aware of</b> the risks involved.</span>（彼はそこに伴うリスクに気づいていた。）</div>
      <div class="ex"><span class="en">He <b>was aware that</b> he had made a mistake.</span>（彼は自分が間違いを犯したことに気づいていた。）</div>
      <div class="ex"><span class="en">He <b>was aware what</b> she wanted to say.</span>（彼は彼女が何を言いたいのか分かっていた。）</div>
    </div>
    <div class="gi" id="gi3">
      <h3><span class="n">3</span>[It is + 形容詞 + to不定詞]</h3>
      <p><span class="lbl">文法ポイント：</span>形式主語 It を使い、真主語である to不定詞の内容を形容詞が説明するパターンです。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>It is easy to misunderstand</b></span>（誤解することは簡単だ）, <span class="en"><b>It is important to be</b></span>（重要だ）</p>
      <div class="ex"><span class="en"><b>It is dangerous to swim</b> in this river.</span>（この川で泳ぐのは危険だ。）</div>
    </div>
    <div class="gi" id="gi4">
      <h3><span class="n">4</span>[主語 + be + 形容詞 + to不定詞]（難易・判断の形容詞）</h3>
      <p><span class="lbl">文法ポイント：</span><span class="en">difficult, hard, easy, impossible</span> などの形容詞が補語に来る場合、to不定詞の目的語が文の主語になっている構造です。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>This subtle difference is easy to misunderstand.</b></span>（本文第1段落の書き換え）</p>
      <div class="ex"><span class="en">This book <b>is hard to read</b>.</span>（この本は読むのが難しい。＝ <span class="en">It is hard to read this book.</span>）</div>
    </div>
    <div class="gi" id="gi5">
      <h3><span class="n">5</span>[be + 形容詞 + to不定詞]（性質・傾向）</h3>
      <p><span class="lbl">文法ポイント：</span><span class="en">quick, slow</span> などの形容詞は、to不定詞を伴って「〜するのが速い／遅い」という意味を表します。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>slow to say</b></span>（言うのが遅い）</p>
      <div class="ex"><span class="en">She <b>is quick to understand</b> the situation.</span>（彼女は状況を理解するのが速い。）</div>
    </div>
    <div class="gi" id="gi6">
      <h3><span class="n">6</span>[afraid to do] vs [afraid of doing]</h3>
      <p><span class="lbl">文法ポイント：</span><span class="en">afraid to do</span>：怖くて〜できない（未来志向、意志的）。<span class="en">afraid of doing</span>：〜する結果になるのではないかと恐れる（可能性、無意志的）。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>afraid to use</b></span>（使うのを恐れる）, <span class="en"><b>afraid of sounding</b></span>（〜のように聞こえることを恐れる）</p>
      <div class="ex"><span class="en">He was <b>afraid to jump</b> from the roof.</span>（彼は怖くて屋根から飛び降りられなかった。）</div>
      <div class="ex"><span class="en">I was <b>afraid of falling</b> on the icy road.</span>（凍った道で転ぶのが怖かった。）</div>
    </div>

  grammar: `
    <p class="lead" style="margin:0 0 6px">感情や心理状態を表す動詞（他動詞）から派生した分詞形容詞（現在分詞 -ing / 過去分詞 -ed）の使い分けがポイントです。</p>
    <div class="gi" id="gi1">
      <h3><span class="n">1</span>-ing 形容詞（現在分詞）：「〜させるような（能動的）」</h3>
      <p><span class="lbl">文法ポイント：</span>主語が原因となって、他者に感情や状態を引き起こす性質を持っていることを表します。「〜させる」「〜するような」と訳せます。物や事柄が主語になることが多いですが、人も主語になれます（その人が他者を楽しませるような人の場合）。</p>

      <p><span class="lbl">パッセージ例：</span><span class="en">users ... are often <b>surprised</b></span>（ユーザーは驚かされる→驚く）, <span class="en">brain ... (is) <b>tricked</b></span>（脳は騙される）, <span class="en">Patients who are <b>terrified</b></span>（恐れている患者）, <span class="en">students might become <b>confused</b></span>（学生は混乱するかもしれない）, <span class="en">critics are <b>concerned</b></span>（批評家は心配している）.</p>

    <div class="gi" id="gi3">
      <h3><span class="n">3</span>叙述用法の文型（S+V+C / S+V+O+C）</h3>

      <h3><span class="n">4</span>感情形容詞の前置詞</h3>
      <p><span class="lbl">文法ポイント：</span>受動態の形をとりますが、動作主を表す by 以外の前置詞（<span class="en">at, with, in, about</span> など）を伴うことが多いです。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en"><b>bored with</b></span>（〜に退屈して）, <span class="en"><b>concerned about</b></span>（〜を心配して）, <span class="en"><b>surprised by</b></span>（〜に驚いて）.</p>

    <p class="lead" style="margin:0 0 6px">このパートでは、冠詞（a/an, the）が省略可能なケースや、省略されるのが一般的なケースを扱います。</p>
    <div class="gi" id="gi1">
      <h3><span class="n">1</span>役職・称号が補語や同格になる場合</h3>
      <p><span class="lbl">文法ポイント：</span>議長、学長、キャプテンなど、その組織やグループで「一人しかいない役職」を表す名詞が、補語（C）や同格として使われる場合、定冠詞 the は付けても付けなくてもよく、省略されることが一般的です。</p>
      <div class="ex"><span class="en">Mr. Henderson was appointed (the) <b>captain</b> of the ship last week.</span>（ヘンダーソン氏は先週、その船の船長に任命された。）</div>
      <div class="ex"><span class="en">Kenji is (the) <b>editor</b> of the school newspaper.</span>（ケンジは学校新聞の編集長だ。）</div>
    </div>
    <div class="gi" id="gi2">
      <h3><span class="n">2</span>対句表現（密接な関係にある2つの名詞の並列）</h3>
      <p><span class="lbl">文法ポイント：</span>2つの名詞が and や前置詞で結ばれて「一つのまとまった概念」や「慣用的なフレーズ」として用いられる場合、冠詞は省略されます。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en">day and night</span>（昼も夜も）, <span class="en">from head to toe</span>（頭からつま先まで）, <span class="en">body and mind</span>（心身）</p>
      <div class="ex"><span class="en">The detective searched the suspect's apartment <b>from top to bottom</b>.</span>（刑事は容疑者のアパートを隅から隅まで捜索した。）</div>
      <div class="ex"><span class="en">They are working together as <b>husband and wife</b> to build a new company.</span>（彼らは新しい会社を設立するために、夫婦として共に働いている。）</div>
    </div>
    <div class="gi" id="gi3">
      <h3><span class="n">3</span>日常の食事名における冠詞の省略</h3>
      <p><span class="lbl">文法ポイント：</span><span class="en">breakfast, lunch, dinner</span> などの日常的な食事を指す場合、通常は無冠詞で用いられます。ただし、「昨日食べたあの素晴らしい夕食」のように特定される場合は the が、形容詞がついて「美味しい夕食」などの種類を表す場合は a/an がつきます。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en">eat breakfast</span></p>
      <div class="ex"><span class="en">What time do you usually <b>have lunch</b> on weekdays?</span>（平日は普段何時に昼食をとりますか？）</div>
      <div class="ex"><span class="en">He treated us to <b>a wonderful dinner</b> after the concert.</span>（コンサートの後、彼が私たちに素晴らしい夕食をごちそうしてくれました。）</div>
      <div class="ex"><span class="en"><b>The dinner</b> we had last night was amazing.</span>（昨夜食べた夕食は最高でした。）</div>
    </div>
    <div class="gi" id="gi4">
      <h3><span class="n">4</span>病気名における冠詞のオプショナル使用</h3>
      <p><span class="lbl">文法ポイント：</span>「風邪をひく」という表現は <span class="en">catch a cold</span> と不定冠詞をつけるのが現在では一般的ですが、冠詞を省略して <span class="en">catch cold</span> とすることも可能です（他の例：<span class="en">(a) fever, (a) rash</span>「発疹」, <span class="en">(the) flu</span>）。</p>
      <p><span class="lbl">パッセージ例：</span><span class="en">catch a cold</span></p>
      <div class="ex"><span class="en">He didn't wear a coat yesterday and ended up <b>catching a cold</b>.</span>（彼は昨日コートを着なかったので、結局風邪をひいてしまった。）</div>
      <div class="ex"><span class="en">Don't go outside with wet hair, or you might <b>catch cold</b>.</span>（濡れた髪のまま外に出てはいけません、さもないと風邪をひきますよ。）</div>
    </div>
    <div class="gi" id="gi5">

(function(){
  const PAT = [0, 2, 1, 3, 2, 0, 3, 1, 1, 3, 0, 2];
  LESSONS.forEach((l, li) => l.rq.forEach((q, i) => {

})();

function nextPartHTML(){
  const i = LESSONS.indexOf(L), n = LESSONS[i + 1];
  return n ? '<div class="nextpart"><button class="btn primary" type="button" data-goto="' + n.id + '">次へ：' + (n.chapter !== L.chapter ? 'Chapter ' + n.chapter + ' ' : '') + 'Part ' + n.part + ' ' + esc(n.title) + ' →</button></div>' : "";
}

/* ===== 動画 ===== */
function setupVideo(){
  const v = $("video");
  const load = () => {
    if (v.dataset.loaded) return;
    v.dataset.loaded = "1";
    if (location.protocol === "file:") {
      v.innerHTML = '<a href="https://www.youtube.com/watch?v=' + L.yt + '" target="_blank" rel="noopener" style="position:absolute;inset:0;display:grid;place-items:center;text-decoration:none">' +
        '<img src="https://i.ytimg.com/vi/' + L.yt + '/hqdefault.jpg" alt="" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75">' +
        '<span style="position:relative;background:#e62117;color:#fff;border-radius:14px;padding:12px 22px;font-weight:700">▶ YouTube で再生</span></a>';
      return;
    }
    v.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + L.yt + '?rel=0" title="解説動画" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  };
  if ("IntersectionObserver" in window) {
    new IntersectionObserver((es, o) => { if (es.some(e => e.isIntersecting)) { load(); o.disconnect(); } }, { rootMargin: "300px" }).observe(v);
  } else load();
}

/* ===== グラマー理解度チェック ===== */
const ansLabel = a => a === "×" ? "×（冠詞なし）" : a;
function renderGQ(){
  const g = L.gcheck;
  $("gq").innerHTML = g.text.map(p => "<p>" + p.replace(/\{(\d+)\}/g, (_, n) => {
    const it = g.items[n - 1];
    return '<span class="blank" id="b' + n + '" data-n="' + n + '" role="group" aria-label="空欄' + n + '"><span class="no">(' + n + ')</span>' +
      it.opts.map(o => '<button type="button" data-o="' + esc(o) + '">' + o + '</button>').join(it.opts.length === 2 ? '<span class="sl" aria-hidden="true">/</span>' : "") + '<span class="mark" aria-live="polite"></span></span>';
  }) + "</p>").join("");
  $("alist").innerHTML = g.items.map((q, i) => {
    const n = i + 1;
    const m = q.exp.match(/^【([^】]+)】\s*/);
    const link = m ? "【" + m[1] + "】" : "【項目" + q.item + "】";
    const body = m ? q.exp.slice(m[0].length) : q.exp;
    return '<li id="a' + n + '" hidden><span class="num">' + n + '</span><div><span class="ans">正解：' + (q.label || q.a) + '<span class="res"></span></span>' +
      '<p class="exp">解説：<button type="button" class="golink" data-item="' + q.item + '">' + link + '</button>' + body + '</p></div></li>';
  }).join("");
}
function pickG(n, o){
  const q = L.gcheck.items[n - 1], box = $("b" + n);
  STATE[L.id].g[n] = o;
  box.querySelectorAll("button").forEach(x => x.classList.toggle("pick", x.dataset.o === o));
  const ok = o === q.a;
  box.classList.toggle("ok", ok); box.classList.toggle("ng", !ok);
  box.querySelector(".mark").textContent = ok ? "○" : "×";
  const li = $("a" + n); li.hidden = false;
  const res = li.querySelector(".res");
  res.className = "res " + (ok ? "ok" : "ng");
  res.textContent = ok ? "○ 正解" : "× あなたの答え：" + ansLabel(o);
  gTally();
}
function gTally(){
  const A = STATE[L.id].g, items = L.gcheck.items;
  const done = Object.keys(A).length;
  $("gScore").textContent = Object.entries(A).filter(([n, v]) => v === items[n - 1].a).length;
  $("gDone").textContent = "（解答済み " + done + "）";
  $("gHint").textContent = done ? "（【項目】を押すと文法解説へ移動します）" : "答えた問題の解説がここに出ます";
}

/* ===== 読解クイズ ===== */
function renderRQ(){
  $("rqlist").innerHTML = L.rq.map((q, i) =>
    '<div class="rq" id="rq' + i + '" data-q="' + i + '"><div class="qh"><span class="qn">Q' + (i + 1) + '</span><div><p class="qtext">' + q.q + '</p><p class="qja">' + q.qja + '</p></div></div>' +
    '<details class="rq-ctx" open><summary>関連パラグラフ ' + q.para.map(p => "¶" + (p + 1)).join("・") + '</summary>' + q.para.map(p => paraHTML(p, "m" + i + "-", false)).join("") + '</details>' +
    '<ul class="opts">' + q.opts.map((o, j) => '<li><button type="button" class="opt" data-q="' + i + '" data-j="' + j + '"><span class="k">' + KEYS[j] + '</span><span>' + o + '</span></button></li>').join("") + '</ul>' +
    '<div class="fb" id="fb' + i + '" hidden></div></div>').join("");
  if (!jaOn) $("rqlist").classList.add("hide-ja");
  $("jaSwitch").setAttribute("aria-pressed", String(jaOn));
  curQ = -1; pickQ();
}
let curQ = -1, jaOn = true;
function focusQ(i){
  if (i === curQ || !L.rq[i]) return;
  curQ = i;
  const paras = L.rq[i].para, pass = $("rqPass");
  pass.classList.toggle("focus", paras.length < L.passage.length);
  pass.querySelectorAll(".rp-para").forEach(el => el.classList.toggle("cur", paras.includes(Number(el.dataset.p))));
  const first = pass.querySelector('.rp-para[data-p="' + paras[0] + '"]');
  if (first && getComputedStyle(pass).display !== "none") pass.scrollTo({ top: first.offsetTop - pass.offsetTop - 8, behavior: "smooth" });
}
function pickQ(){
  const list = $("rqlist"); if (!list) return;
  let best = 0;
  [...list.querySelectorAll(".rq")].forEach((b, i) => { if (b.getBoundingClientRect().top < innerHeight * 0.45) best = i; });
  focusQ(best);
}
function showEvidence(i, scroll){
  const q = L.rq[i], pass = $("rqPass");
  document.querySelectorAll(".s.ev").forEach(e => e.classList.remove("ev"));
  q.ev.forEach(id => ["p-", "m" + i + "-"].forEach(pre => {
    const e = $(pre + id); if (e) { void e.offsetWidth; e.classList.add("ev"); }
  }));
  curQ = -1; focusQ(i);
  if (!scroll) return;
  const side = $("p-" + q.ev[0]);
  if (side && getComputedStyle(pass).display !== "none") pass.scrollTo({ top: side.offsetTop - pass.offsetTop - 60, behavior: "smooth" });
  else { const ctx = document.querySelector("#rq" + i + " .rq-ctx"); if (ctx) ctx.open = true; }
}
function answerR(i, j, scroll){
  const q = L.rq[i];
  STATE[L.id].r[i] = j;
  $("rq" + i).querySelectorAll(".opt").forEach((x, k) => {
    x.disabled = true;
    if (k === q.ans) x.classList.add("correct");
    else if (k === j) x.classList.add("wrong");
  });
  const ok = j === q.ans;
  const evText = q.ev.map(id => $(id).textContent).join(" ");
  const fb = $("fb" + i);
  fb.innerHTML =
    '<p class="v ' + (ok ? "ok" : "ng") + '">' + (ok ? "◎ 正解！" : "× 不正解　正解は " + KEYS[q.ans]) + '</p>' +
    '<div class="evid"><span class="en">' + evText + '</span><span class="ja">' + q.evja + '</span></div>' +
    '<button type="button" class="golink toev" data-q="' + i + '">本文で根拠の文をもう一度光らせる</button>' +
    '<ul>' + q.why.map((w, k) => '<li class="' + (k === q.ans ? "right" : "") + '"><span class="k">' + KEYS[k] + '</span>' + w + '</li>').join("") + '</ul>';
  fb.hidden = false;
  if (scroll) showEvidence(i, true);
  rTally();
}
function rTally(){
  $("rScore").textContent = Object.entries(STATE[L.id].r).filter(([i, j]) => L.rq[i].ans === j).length;
}

/* ===== 状態の復元（Part を行き来しても答えが残る） ===== */
function restore(){
  const S = STATE[L.id];
  Object.entries(S.g).forEach(([n, o]) => pickG(Number(n), o));
  Object.entries(S.r).forEach(([i, j]) => answerR(Number(i), j, false));
  gTally(); rTally();
}

/* ===== クリック（画面全体で受ける） ===== */
document.addEventListener("click", e => {
  const t = e.target;
  let b;
  if ((b = t.closest(".nav a"))) { e.preventDefault(); const s = document.querySelector(b.getAttribute("href")); if (s) s.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if ((b = t.closest("[data-goto]"))) { show(b.dataset.goto, true); return; }
  if ((b = t.closest(".blank button"))) { pickG(Number(b.closest(".blank").dataset.n), b.dataset.o); return; }
  if ((b = t.closest(".alist .golink"))) {
    const el = $("gi" + b.dataset.item); if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 2200);
    return;
  }
  if ((b = t.closest(".toev"))) { showEvidence(Number(b.dataset.q), true); return; }
  if ((b = t.closest(".opt"))) { if (!b.disabled) answerR(Number(b.dataset.q), Number(b.dataset.j), true); return; }
  if ((b = t.closest(".rate button"))) {
    $("aud").playbackRate = Number(b.dataset.r);
    document.querySelectorAll(".rate button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    return;
  }
  if (t.closest("#gpSwitch")) {
    const s = $("gpSwitch"), on = s.getAttribute("aria-pressed") !== "true";
    s.setAttribute("aria-pressed", String(on)); $("passage").classList.toggle("show-gp", on); return;
  }
  if (t.closest("#jaSwitch")) {
    jaOn = !jaOn; $("jaSwitch").setAttribute("aria-pressed", String(jaOn)); $("rqlist").classList.toggle("hide-ja", !jaOn); return;
  }
  if (t.closest("#gShowAll")) { $("alist").querySelectorAll("li").forEach(li => li.hidden = false); $("gHint").textContent = "（【項目】を押すと文法解説へ移動します）"; return; }
  if (t.closest("#gReset")) { STATE[L.id].g = {}; renderGQ(); gTally(); return; }
  if (t.closest("#rReset")) { STATE[L.id].r = {}; renderRQ(); rTally(); document.querySelectorAll(".s.ev").forEach(e => e.classList.remove("ev")); return; }
});
document.addEventListener("focusin", e => { const b = e.target.closest && e.target.closest(".rq"); if (b) focusQ(Number(b.dataset.q)); });

/* ===== Part の表示 ===== */
function show(id, scrollTop){
  const next = LESSONS.find(l => l.id === id) || LESSONS[0];
  const a = $("aud"); if (a) a.pause();
  L = next;
  STATE[L.id] = STATE[L.id] || { g: {}, r: {} };
  drawBar(L.chapter);
  document.querySelectorAll(".ptab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === L.id)));
  render();
  try { history.replaceState(null, "", "#part-" + L.id); } catch (e) {}
  if (scrollTop) scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

/* ===== ナビの現在地 ===== */
function onScroll(){
  const links = [...document.querySelectorAll(".nav a")];
  let cur = 0;
  links.forEach((a, i) => { const s = document.querySelector(a.getAttribute("href")); if (s && s.getBoundingClientRect().top < 120) cur = i; });
  links.forEach((a, i) => a.classList.toggle("on", i === cur));
  pickQ();
}
addEventListener("scroll", onScroll, { passive: true });

/* ===== テーマ ===== */
const themeBtn = $("themeBtn");
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "ライト" : "ダーク";
  themeBtn.setAttribute("aria-pressed", String(t === "dark"));
  try { localStorage.setItem("rd-theme", t); } catch (e) {}
}
let saved = null; try { saved = localStorage.getItem("rd-theme"); } catch (e) {}
setTheme(saved || "light");
themeBtn.addEventListener("click", () => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));

/* ===== 起動 ===== */
let start = LESSONS[0].id;
try { const h = location.hash.match(/^#part-(.+)$/); if (h && LESSONS.some(l => l.id === h[1])) start = h[1]; } catch (e) {}
show(start, false);
</script>
